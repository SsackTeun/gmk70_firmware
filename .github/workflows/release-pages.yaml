name: Firmware release links

on:
  repository_dispatch:
    types: [gmk70-firmware-published]
  push:
    branches: [main]
    paths: [.github/workflows/release-pages.yaml]

permissions:
  contents: read

jobs:
  pages:
    name: Deploy latest firmware links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      # The job reads all three releases after acquiring this shared slot.
      group: gmk70-latest-firmware-pages
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate release redirects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build-support/github_release.py pages --output .work/releases/site
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .work/releases/site
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
